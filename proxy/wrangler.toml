# FLOODGUARD AI - edge proxy for the Cloudflare Worker.
#
# Deploying this gives you a permanent https://<name>.<subdomain>.workers.dev
# URL. That URL is what NEXT_PUBLIC_API_BASE on Vercel points at, and it never
# changes. The volatile quick-tunnel URL lives in the KV namespace below.
#
#   npx wrangler kv namespace create ORIGIN   -> prints an id, paste it below
#   npx wrangler deploy
#   npx wrangler kv key put --binding=ORIGIN ORIGIN_URL "<tunnel-url>"

name = "floodguard-api-edge"
main = "worker.js"
compatibility_date = "2026-10-01"

# Set by the first `wrangler deploy`. Vercel and any other client point here.
workers_dev = true

# The origin is read from KV on every request. Fallback only, for the window
# between the first deploy and the first `kv key put`.
[vars]
ORIGIN_URL = ""

# REPLACE id with the value printed by `wrangler kv namespace create ORIGIN`.
[[kv_namespaces]]
binding = "ORIGIN"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true
