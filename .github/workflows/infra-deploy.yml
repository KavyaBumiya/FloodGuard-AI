name: Deploy Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write
  contents: read

env:
  LOCATION: centralindia
  NAME_PREFIX: floodguard

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v1
        with:
          resourceGroupName: ${{ env.NAME_PREFIX }}-rg
          template: ./infra/main.bicep
          parameters: >
            location=${{ env.LOCATION }}
            namePrefix=${{ env.NAME_PREFIX }}
            pgAdminPassword=${{ secrets.DB_PASSWORD }}
            redisPassword=${{ secrets.REDIS_PASSWORD }}
            jwtSecret=${{ secrets.JWT_SECRET }}
            iotRegistrationToken=${{ secrets.IOT_REG_TOKEN }}
            frontendOrigin=https://flood-guard-ai-theta.vercel.app

      - name: Output connection details
        run: |
          echo "Infrastructure deployed successfully!"
          echo "Container Registry: ${{ env.NAME_PREFIX }}acr${{ secrets.AZURE_SUBSCRIPTION_ID }}.azurecr.io"
          echo "PostgreSQL: ${{ env.NAME_PREFIX }}-db.postgres.database.azure.com"
          echo "Redis: ${{ env.NAME_PREFIX }}-redis.redis.cache.windows.net"