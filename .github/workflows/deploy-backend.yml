name: Deploy Backend to Azure

on:
  push:
    branches:
      - main

env:
  ACR_NAME: floodguardacr
  IMAGE_NAME: floodguard-backend
  RESOURCE_GROUP: Flood-guard-ai
  CONTAINER_APP: floodguard-backend
  HEALTH_URL: https://floodguard-backend.ashyplant-04472250.centralindia.azurecontainerapps.io/healthz

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f backend/Dockerfile .

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars FRONTEND_ORIGIN=https://flood-guard-ai-theta.vercel.app RELEASE_LOAD_OSM=true DEMO_MODE_ENABLED=false

      - name: Wait for deployment
        run: |
          echo "Waiting for Azure Container App to become healthy..."

          for i in {1..30}; do
            STATUS=$(az containerapp show \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              --output tsv)

            echo "Attempt $i/30 - Container App status: $STATUS"

            if [ "$STATUS" = "Running" ]; then
              echo "Container App is running."
              break
            fi

            if [ "$i" = "30" ]; then
              echo "Container App did not become Running within 5 minutes."
              exit 1
            fi

            sleep 10
          done

      - name: Verify public health endpoint
        run: |
          echo "Checking ${{ env.HEALTH_URL }}"

          for i in {1..30}; do
            echo "Health check attempt $i/30..."

            if curl --fail --silent --show-error ${{ env.HEALTH_URL }}; then
              echo ""
              echo "Backend is healthy."
              exit 0
            fi

            if [ "$i" = "30" ]; then
              echo "Backend health check failed after 5 minutes."
              exit 1
            fi

            echo "Backend is not ready yet. Waiting 10 seconds..."
            sleep 10
          done
