# FLOODGUARD AI — full local/server stack.
#
#   docker compose up -d --build
#
# Brings up Postgres (PostGIS), Redis, runs migrations once, then starts the
# API. The backend runs INSIDE Docker; nothing needs to be started from the
# host. Telemetry ingress is HTTPS-capable HTTP: `POST /api/iot/telemetry`,
# no broker.
#
# Service order is enforced, not hoped for:
#
#   db, redis  healthy
#        └─> migrate   runs `python -m scripts.release`, exits 0
#              └─> backend   starts only after migrate exits successfully
#
# If migrations fail, backend never starts and the failure is visible in
# `docker compose logs migrate` rather than showing up as a broken console.

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+asyncpg://floodguard:floodguard@db:5432/floodguard
  REDIS_URL: redis://redis:6379/0
  # Set this in a root .env to change it. The default is fine for a LAN demo.
  IOT_REGISTRATION_TOKEN: ${IOT_REGISTRATION_TOKEN:-local-dev-registration-token}
  # Browser origins allowed by CORS. Empty = allow all.
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
  # Safety valve: the flood engine must fail loudly rather than invent terrain.
  ALLOW_SYNTHETIC_TERRAIN: "false"
  DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-true}
  SOCKETIO_MESSAGE_QUEUE: "true"

x-app-build: &app-build
  # Build context is the REPO ROOT: resolve_data_path() resolves every dataset
  # against the root, so data/ and models/ must sit beside backend/.
  context: .
  dockerfile: backend/Dockerfile

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: floodguard-db
    environment:
      POSTGRES_USER: floodguard
      POSTGRES_PASSWORD: floodguard
      POSTGRES_DB: floodguard
    ports:
      # Bound to loopback on purpose. The API reaches Postgres over the compose
      # network, so publishing 5432 to 0.0.0.0 would only let anything else on
      # your WiFi try to log in as a superuser with password `floodguard`.
      # Set DB_PUBLISH=0.0.0.0 in a root .env if you really need psql from
      # another machine.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodguard -d floodguard"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: floodguard-redis
    ports:
      # Loopback-only for the same reason as Postgres above: Redis here has no
      # password, so publishing it would be an open door.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot. Waits for Postgres, enables PostGIS, runs `alembic upgrade head`,
  # and (first time only) loads the OSM layers. Runs to completion and exits.
  migrate:
    build: *app-build
    image: floodguard-api:local
    container_name: floodguard-migrate
    command: ["python", "-m", "scripts.release"]
    environment:
      <<: *app-env
      # Loads ~4,500 buildings + ~4,500 roads once. Both steps are idempotent,
      # so leaving this true on every `up` only costs a few seconds of counting.
      # Set to false once the layers exist if you want faster restarts.
      RELEASE_LOAD_OSM: ${RELEASE_LOAD_OSM:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    build: *app-build
    image: floodguard-api:local
    container_name: floodguard-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      <<: *app-env
    healthcheck:
      # /healthz touches no database and no third party, so a slow upstream can
      # never mark a healthy container down. The Dockerfile declares the same.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    restart: unless-stopped

  # Exposes the API to the public internet so a Vercel-hosted frontend can reach
  # it. Opt-in via a profile: it is NOT started by a plain `docker compose up`.
  #
  #   QUICK TUNNEL (no account, URL changes every restart)
  #       docker compose --profile tunnel up -d
  #       docker compose logs tunnel | Select-String trycloudflare
  #
  #   NAMED TUNNEL (stable URL - recommended for Vercel)
  #       Set in a root .env:
  #         CLOUDFLARE_TUNNEL_CMD=tunnel --no-autoupdate run
  #         TUNNEL_TOKEN=<token from the Cloudflare Zero Trust dashboard>
  #       then the URL is whatever hostname you gave the tunnel, e.g.
  #       https://api.yourdomain.com
  #
  # Why a tunnel is needed at all: Vercel serves the frontend from the public
  # internet, and this API lives on a private LAN address. There is no route
  # between them until something opens an outbound connection - which is
  # exactly what a tunnel does, with no inbound port on your router.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: floodguard-tunnel
    profiles: ["tunnel"]
    depends_on:
      backend:
        condition: service_healthy
    # Origin is the PUBLISHED PORT on the Docker host, not the compose service
    # name. cloudflared resolves the origin once at connect time and then holds
    # that IP for the life of the tunnel, so pointing it at `backend:8000`
    # breaks every time the backend is rebuilt: the container comes back with a
    # new IP and the tunnel keeps dialling the dead one
    # ("dial tcp 172.20.0.4:8000: connection refused" -> HTTP 502 -> the browser
    # reports a CORS error because there is no origin to return headers from).
    #
    # host.docker.internal is stable across container rebuilds, so this survives
    # `docker compose up --build`.
    command: >-
      tunnel --no-autoupdate
      --url ${CLOUDFLARE_ORIGIN:-http://host.docker.internal:8000}
    environment:
      # Only read for a named tunnel; ignored by the quick tunnel.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: